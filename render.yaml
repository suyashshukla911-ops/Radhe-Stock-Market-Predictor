services:
  - type: web
    name: radhe-stock-market-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    # disk:            # needs a paid instance; keeps EOD outlook + token across restarts
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # - key: CACHE_DIR # Uncomment only if a persistent disk is mounted at /var/data
      #   value: /var/data
      - key: APP_NAME
        value: Suyash Stock Market Predictor
      - key: APP_BASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_CLIENT_ID
        sync: false
      - key: UPSTOX_CLIENT_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_PROVIDER
        value: freenewsapi
      - key: NEWS_DAILY_QUOTA
        value: "5000"
      - key: NEWS_MIN_INTERVAL_SECONDS
        value: "4.5"
      - key: NEWS_REFRESH_MINUTES
        value: "30"
      - key: TOI_REFRESH_MINUTES
        value: "10"
      - key: X_REFRESH_MINUTES
        value: "30"
      - key: MONEYCONTROL_REFRESH_MINUTES
        value: "30"
      - key: X_BEARER_TOKEN
        sync: false
      - key: LIVE_POLL_SECONDS
        value: "5"
      - key: PREDICTION_REFRESH_SECONDS
        value: "20"
      - key: WATCH_REFRESH_SECONDS
        value: "300"
      - key: MODEL_RETRAIN_MINUTES
        value: "30"
      - key: TRAIN_DAYS_SHORT
        value: "30"
      - key: TRAIN_DAYS_LONG
        value: "90"
      - key: MIN_TRAIN_ROWS
        value: "300"
      - key: CHART_BARS
        value: "180"
      - key: HISTORY_CACHE_MINUTES
        value: "20"
      - key: LIVE_REST_CACHE_SECONDS
        value: "60"
