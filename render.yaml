services:
  - type: web
    name: radhe-stock-market-predictor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Radhe Stock Market Predictor
      - key: APP_BASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_CLIENT_ID
        sync: false
      - key: UPSTOX_CLIENT_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_PROVIDER
        value: freenewsapi
      - key: NEWS_DAILY_QUOTA
        value: "5000"
      - key: NEWS_MIN_INTERVAL_SECONDS
        value: "0.51"
      - key: LIVE_POLL_SECONDS
        value: "1"
      - key: PREDICTION_REFRESH_SECONDS
        value: "30"
      - key: WATCH_REFRESH_SECONDS
        value: "15"
      - key: MODEL_RETRAIN_MINUTES
        value: "30"
      - key: TRAIN_DAYS_SHORT
        value: "30"
      - key: TRAIN_DAYS_LONG
        value: "90"
      - key: MIN_TRAIN_ROWS
        value: "300"
      - key: CHART_BARS
        value: "180"
